# Xcode-Projekt für die iPhone-App „Guten Morgen“ und ihr Widget. Erzeugen: xcodegen generate
name: GutenMorgen
options:
  bundleIdPrefix: de.teyro
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  MorgenKern:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  GutenMorgen:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Gemeinsam
      - path: ressourcen/Assets.xcassets
    dependencies:
      - package: MorgenKern
      - target: GutenMorgenWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: GutenMorgen
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.gutenmorgen
        INFOPLIST_FILE: ressourcen/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ressourcen/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  GutenMorgenWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Gemeinsam
    dependencies:
      - package: MorgenKern
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: GutenMorgenWidget
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.gutenmorgen.widget
        INFOPLIST_FILE: ressourcen/Widget.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ressourcen/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  GutenMorgen-Uhr:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Uhr
      - path: ressourcen/Assets.xcassets
    dependencies:
      - package: MorgenKern
    settings:
      base:
        PRODUCT_NAME: Guten Morgen
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.gutenmorgen.watchkitapp
        INFOPLIST_FILE: ressourcen/Uhr.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
schemes:
  GutenMorgen:
    build:
      targets:
        GutenMorgen: all
  GutenMorgen-Uhr:
    build:
      targets:
        GutenMorgen-Uhr: all
